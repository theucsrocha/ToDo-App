<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicação TODO List</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>Minha Lista de Tarefas</h1>
        
        <!-- Formulário para criar/editar tarefa -->
        <div class="form-section">
            <h2 id="formTitle">Nova Tarefa</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskName">Nome da Tarefa:</label>
                    <input type="text" id="taskName" placeholder="Digite o nome da tarefa" required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Descrição:</label>
                    <textarea id="taskDescription" placeholder="Descrição da tarefa" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskExpiration">Data de Expiração:</label>
                        <input type="date" id="taskExpiration" required>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Prioridade:</label>
                        <select id="taskPriority" required>
                            <option value="">Selecione...</option>
                            <option value="1">Baixa</option>
                            <option value="2">Média</option>
                            <option value="1">Alta</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory">Categoria:</label>
                        <input type="text" id="taskCategory" placeholder="Ex: Trabalho, Pessoal, Estudo">
                    </div>

                    <div class="form-group">
                        <label for="taskStatus">Status:</label>
                        <select id="taskStatus" required>
                            <option value="">Selecione...</option>
                            <option value="TODO">TODO</option>
                            <option value="DOING">DOING</option>
                            <option value="DONE">DONE</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="submitBtn" class="btn btn-primary">Adicionar Tarefa</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Seção de listagem de tarefas -->
        <div class="list-section">
            <h2>Tarefas</h2>
            
            

            <table id="tasksTable">
                <thead>
                    <tr>
                        <th>Selecionar</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Expiração</th>
                        <th>Prioridade</th>
                        <th>Categoria</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tasksBody">
                    <tr class="empty-state">
                        <td colspan="7">Nenhuma tarefa criada ainda</td>
                    </tr>
                </tbody>
            </table>
            <div class="multi-select-actions">
                <select id="multiStatusSelect">
                    <option value="">Mudar status para...</option>
                    <option value="TODO">TODO</option>
                    <option value="DOING">DOING</option>
                    <option value="DONE">DONE</option>
                </select>
                <button type="button" id="executarMultiStatus" class="btn btn-primary">Executar</button>
            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
